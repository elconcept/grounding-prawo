[project]
name = "ugh-ocr"
version = "0.1.0"
description = "Mieszany pipeline OCR: markitdown dla stron z prawdziwa warstwa tekstu, llamaindex-ocr (fallback: markitdown-vision) dla reszty."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "markitdown[all]>=0.1.7",
  "markitdown-vision",
  "llamaindex-ocr",
  "pymupdf>=1.24.0",
  "pyyaml>=6.0",
]

[project.scripts]
ugh-ocr = "ugh_ocr.__main__:main"

[tool.uv.sources]
markitdown-vision = { path = "../markitdown-vision", editable = true }
llamaindex-ocr = { path = "../llamaindex-ocr", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ugh_ocr"]
