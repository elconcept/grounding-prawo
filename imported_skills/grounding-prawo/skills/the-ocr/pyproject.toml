[project]
name = "the-ocr"
version = "0.1.0"
description = "Polish OCR pipeline: Datalab with LlamaParse fallback, spatial JSON, Markdown, and searchable PDF."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-cloud>=0.1.0",
    "httpx>=0.28.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pymupdf>=1.24.0",
    "pikepdf>=9.0.0",
]

[project.scripts]
the-ocr = "the_ocr.cli:main"

[dependency-groups]
dev = ["pyinstaller>=6.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
# Restrict bare `pytest` to tests/ -- without this, collection walks into
# Resources/ (vendored copies of other projects/skills with clashing module
# names like contract.py/pii_flags.py) and fails before running anything.
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
