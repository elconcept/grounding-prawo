[project]
name = "llamaindex-ocr"
version = "0.2.0"
description = "LlamaCloud/LlamaParse -> Markdown pojedynczego pliku, z frontmatterem zgodnym z markitdown-vision."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "llama-cloud>=0.1.0",
  "pyyaml>=6.0",
]

[project.scripts]
llamaindex-ocr = "llamaindex_ocr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llamaindex_ocr"]
