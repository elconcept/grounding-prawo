[project]
name = "markitdown-vision"
version = "0.1.0"
description = "MarkItDown + Google Cloud Vision OCR: konwersja dowolnego pliku do .md, z automatycznym OCR dla obrazow i PDF-ow bez warstwy tekstowej."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "markitdown[all]>=0.1.7",
  "markitdown-ocr",
  "google-cloud-vision>=3.15.0",
  "pyyaml>=6.0",
  "mcp[cli]>=1.2.0",
]

[project.scripts]
markitdown-vision = "markitdown_vision.__main__:main"
markitdown-vision-mcp = "markitdown_vision.mcp_server:main"

[tool.uv.sources]
markitdown-ocr = { path = "../markitdown-ocr" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_vision"]
