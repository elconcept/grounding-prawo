# Selekcja skilli pluginu grounding-prawo. Źródło prawdy dla scripts/build.py.
# Własna analiza (14.10.2026). Analizy GPT i Sonnet użyte jako doradcy, nie jako polecenie.
# from: lex = vendor/packs/LexMachina/"Wersja rozwojowa rozpakowana"; awe:<pakiet> = vendor/packs/awesome-matematic-skills;
#       own = own-skills/ (źródła utrzymywane lokalnie, również adaptacje); vendor:<katalog> = vendor/<katalog>.
# transitional: true = zależność szturm-na-draft-pl; ocenić ponownie po jego przebudowie.
# internal: true = moduł pomocniczy routera; pozostaje dostępny dla modelu (import OpenAI odrzuca disable-model-invocation).
# Zasada: LexMachina jest spleciona (shared odwołuje się do audyt-systemu 33x, do DR-04..15 16x),
# więc jest zachowana jako zamknięty silnik; wycinamy tylko moduły, które da się odciąć patchem.
version: "0.4.1"
keep:
  - {name: wiki-basic-memory, from: own, why: "pytania, syntezy i kontrola jakości wiki przez istniejące MCP", description: "Wiki spraw w Basic Memory: ingest PDF strona po stronie przez model (Markdown do Basic Memory, PDF do R2), pytania i syntezy, kontrola jakości (odnośniki, duplikaty, sprzeczności, luki)."}
  - {name: ingest-wiki, merge_into: wiki-basic-memory, typ: "ingest PDF do Basic Memory strona po stronie przez model; oryginał PDF do R2", from: own, why: "pełny ingest przez narzędzia MCP basic-memory, także w klientach przeglądarkowych"}
  - {name: teczka-sprawy, from: own, why: "narzędzia teczki przeniesione z legal do pluginu"}
  - {name: odczyt-dokumentow, from: own, why: "Jeden odczyt dokumentów do Markdown i kontraktu; the-ocr jako narzędzie, bez lokalnego OCR", description: "Przyjęcie dokumentu: skan bezpieczeństwa (ukryte polecenia, znaki niewidoczne), weryfikacja podpisu PDF, odczyt do Markdown ze stronami i kontrakt JSON do cytowania. Używaj przed analizą lub ingestem dokumentu."}
