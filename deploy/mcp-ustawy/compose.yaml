# mcp-ustawy - baza ustaw z komentarzem (Streamable HTTP /mcp, port 8080, bezstanowy). Stack Portainera "mcp-ustawy".
# Zastępuje mcp-cite. Port na hoście 8412 (LAN: http://10.0.10.201:8412/mcp). Z internetu: tunel
# cloudflared (sieć cf_mcp_ustawy) i portal lex jako serwer "ustawy".
# Kontekst budowania: katalog repo grounding-prawo na NAS. Przebudowa pobiera świeże brzmienia ustaw.
services:
  mcp-ustawy:
    build:
      context: ../..
      dockerfile: deploy/mcp-ustawy/Dockerfile
      args:
        LAW_REFRESH: "${LAW_REFRESH:-0}"
    image: mcp-ustawy:latest
    container_name: mcp-ustawy
    environment:
      - TZ=Europe/Warsaw
    ports:
      - "8412:8080"
    networks:
      - cf_mcp_ustawy
    restart: unless-stopped

networks:
  cf_mcp_ustawy:
    external: true
